name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bin=bbcore
          if [ "$GOOS" = "windows" ]; then bin=bbcore.exe; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/cloudflypeng/bbcore/internal/service.Version=${TAG#v}" \
            -o "dist/$bin" ./cmd/bbcore
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q "bbcore-${TAG}-${GOOS}-${GOARCH}.zip" "$bin")
          else
            tar -C dist -czf "dist/bbcore-${TAG}-${GOOS}-${GOARCH}.tar.gz" "$bin"
          fi
          rm -f "dist/$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: bbcore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
